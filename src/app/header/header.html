<header class="bg-white shadow-sm border-b border-gray-200 px-6 py-4 flex justify-between items-center">
  <div class="flex items-center space-x-4">
    <!-- Hamburger Menu Button - visible only on mobile/tablet -->
    <button
      mat-icon-button
      (click)="onMenuClick()"
      class="lg:hidden mr-2">
      <mat-icon>menu</mat-icon>
    </button>
    <h1 class="text-xl font-semibold text-gray-800">Dashboard</h1>
  </div>
  <div class="flex items-center space-x-4">
    <div class="relative">
      <input type="text" placeholder="Search..." class="pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
      <svg class="absolute left-3 top-2.5 h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
      </svg>
    </div>
    <button class="relative p-2 text-gray-400 hover:text-gray-600 flex items-center justify-center">
      <mat-icon class="text-2xl leading-none">notifications</mat-icon>
      <span class="absolute top-0 right-0 h-2 w-2 bg-red-500 rounded-full"></span>
    </button>
    <div class="flex space-x-2">
      <mat-icon class="flex  text-3xl text-gray-400 !overflow-visible">account_circle</mat-icon>
      <div class="text-left">
        <p class="text-sm font-medium text-gray-700">John Doe</p>
        <p class="text-xs text-gray-500">Administrator</p>
      </div>
    </div>
  </div>
</header>
