<div class="dashboard p-4">
  <h1 class="text-2xl font-bold mb-4">Dashboard</h1>
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div class="chart-container">
      <h2 class="text-xl mb-2">Sales Bar Chart</h2>
      <app-chart [chartData]="barChartData"></app-chart>
    </div>
    <div class="chart-container">
      <h2 class="text-xl mb-2">Revenue Line Chart</h2>
      <app-chart [chartData]="lineChartData"></app-chart>
    </div>
  </div>
</div>
