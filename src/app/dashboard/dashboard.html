<div class="dashboard p-6 bg-gray-100 min-h-screen">
  <h3 class="text-lg font-bold text-gray-800">Welocome, Jhon Doe</h3>
  <div class="mb-4 text-gray-400">Here is your timesheet summary for {{ currentDate }}</div>
  <!-- Stats Cards -->
  <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
    <div class="bg-white p-6 rounded-lg shadow-md">
      <h3 class="text-sm font-medium text-gray-500">Total Users</h3>
      <p class="text-2xl font-bold text-gray-900">1,234</p>
      <p class="text-sm text-green-600">+12% from last month</p>
      <div class="mt-2">
        <div class="w-full bg-gray-200 rounded-full h-2">
          <div class="bg-blue-600 h-2 rounded-full" style="width: 75%"></div>
        </div>
      </div>
    </div>
    <div class="bg-white p-6 rounded-lg shadow-md">
      <h3 class="text-sm font-medium text-gray-500">Revenue</h3>
      <p class="text-2xl font-bold text-gray-900">$45,678</p>
      <p class="text-sm text-green-600">+8% from last month</p>
      <div class="mt-2">
        <div class="w-full bg-gray-200 rounded-full h-2">
          <div class="bg-green-600 h-2 rounded-full" style="width: 60%"></div>
        </div>
      </div>
    </div>
    <div class="bg-white p-6 rounded-lg shadow-md">
      <h3 class="text-sm font-medium text-gray-500">Orders</h3>
      <p class="text-2xl font-bold text-gray-900">567</p>
      <p class="text-sm text-red-600">-2% from last month</p>
      <div class="mt-2">
        <div class="w-full bg-gray-200 rounded-full h-2">
          <div class="bg-red-600 h-2 rounded-full" style="width: 45%"></div>
        </div>
      </div>
    </div>
    <div class="bg-white p-6 rounded-lg shadow-md">
      <h3 class="text-sm font-medium text-gray-500">Conversion Rate</h3>
      <p class="text-2xl font-bold text-gray-900">3.2%</p>
      <p class="text-sm text-green-600">+0.5% from last month</p>
      <div class="mt-2">
        <div class="w-full bg-gray-200 rounded-full h-2">
          <div class="bg-yellow-600 h-2 rounded-full" style="width: 80%"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Charts and Quick Actions -->
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
    <div class="bg-white p-6 rounded-lg shadow-md">
      <h2 class="text-xl font-semibold mb-4 text-gray-800">Sales Overview</h2>
      <app-chart [chartData]="barChartData"></app-chart>
    </div>
    <div class="bg-white p-6 rounded-lg">
      <app-quick-actions
        (newProjectTask)="onNewProjectTask()"
        (requestTime)="onRequestTime()"
        (generateReport)="onGenerateReport()">
      </app-quick-actions>
    </div>
  </div>

  <!-- Recent Transactions -->
  <app-recent-transactions></app-recent-transactions>
</div>
