<div class="p-6">
  <h2 class="text-xl font-semibold mb-4">Create New Project Task</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Project Name</mat-label>
      <input matInput formControlName="projectName" placeholder="Enter project name">
      <mat-error *ngIf="form.get('projectName')?.invalid && form.get('projectName')?.touched">
        Project name is required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Task Name</mat-label>
      <input matInput formControlName="taskName" placeholder="Enter task name">
      <mat-error *ngIf="form.get('taskName')?.invalid && form.get('taskName')?.touched">
        Task name is required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description" rows="3" placeholder="Enter task description"></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Priority</mat-label>
      <mat-select formControlName="priority">
        <mat-option value="low">Low</mat-option>
        <mat-option value="medium">Medium</mat-option>
        <mat-option value="high">High</mat-option>
        <mat-option value="urgent">Urgent</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Start Date</mat-label>
      <input matInput [matDatepicker]="startPicker" formControlName="startDate">
      <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
      <mat-datepicker #startPicker></mat-datepicker>
      <mat-error *ngIf="form.get('startDate')?.invalid && form.get('startDate')?.touched">
        Start date is required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>End Date</mat-label>
      <input matInput [matDatepicker]="endPicker" formControlName="endDate">
      <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
      <mat-datepicker #endPicker></mat-datepicker>
      <mat-error *ngIf="form.get('endDate')?.invalid && form.get('endDate')?.touched">
        End date is required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Assigned To</mat-label>
      <input matInput formControlName="assignedTo" placeholder="Enter assignee name">
      <mat-error *ngIf="form.get('assignedTo')?.invalid && form.get('assignedTo')?.touched">
        Assignee is required
      </mat-error>
    </mat-form-field>

    <div class="flex justify-end space-x-2 mt-6">
      <button mat-button type="button" (click)="onCancel()">Cancel</button>
      <button mat-raised-button color="primary" type="submit" [disabled]="!form.valid">Create Task</button>
    </div>
  </form>
</div>
