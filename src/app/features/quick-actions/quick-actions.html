<div class="">
  <h2 class="text-xl font-semibold mb-4 text-gray-800">Quick Actions</h2>
  <div class="grid grid-cols-1 gap-4">
    <div class="py-2 bg-gray-200 rounded-lg shadow-sm px-4 cursor-pointer hover:bg-gray-200/50" (click)="newProjectTask.emit()">
      <img src="/assets/icons/quick-action-1.png" class="h-8 w-8 inline-block rounded-full"/>
      New Project Task
    </div>
    <div class="py-2 bg-gray-200 rounded-lg shadow-sm px-4 cursor-pointer hover:bg-gray-200/50" (click)="requestTime.emit()">
      <img src="/assets/icons/quick-action-2.png" class="h-8 w-8 inline-block rounded-full"/>
      Request Time
    </div>
    <div class="py-2 bg-gray-200 rounded-lg shadow-sm px-4 cursor-pointer hover:bg-gray-200/50" (click)="generateReport.emit()">
      <img src="/assets/icons/quick-action-3.png" class="h-8 w-8 inline-block rounded-full"/>
      Generate Report
    </div>
  </div>
</div>
