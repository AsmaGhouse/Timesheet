<div class="overflow-auto">
  <table *ngIf="loading" class="min-w-full divide-y divide-gray-200 animate-pulse">
    <thead class="bg-gray-50">
      <tr>
        <th *ngFor="let column of columns" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
          <div class="h-4 bg-gray-200 rounded"></div>
        </th>
      </tr>
    </thead>
    <tbody class="bg-white divide-y divide-gray-200">
      <tr *ngFor="let i of [1,2,3,4,5]">
        <td *ngFor="let column of columns" class="px-6 py-4 whitespace-nowrap">
          <div class="h-4 bg-gray-200 rounded"></div>
        </td>
      </tr>
    </tbody>
  </table>
  <div *ngIf="!loading && data.length === 0" class="text-center py-8 text-gray-500">
    No records found
  </div>
  <table *ngIf="!loading && data.length > 0" class="min-w-full divide-y divide-gray-200">
    <thead class="bg-gray-50">
      <tr>
        <th *ngFor="let column of columns" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
          {{ column.label }}
        </th>
      </tr>
    </thead>
    <tbody class="bg-white divide-y divide-gray-200">
      <tr *ngFor="let row of data">
        <ng-container *ngFor="let column of columns">
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" [class.text-center]="column.key === 'actions'">
            <ng-container *ngIf="column.key === 'select'">
              <input type="checkbox" [checked]="selectedItems.includes(row[idKey])" (change)="selectionChange.emit(row[idKey])" class="rounded">
            </ng-container>
            <ng-container *ngIf="column.key !== 'status' && column.key !== 'actions' && column.key !== 'select'">
              {{ row[column.key] }}
            </ng-container>
            <ng-container *ngIf="column.key === 'status'">
              <span [appStatusBadge]="row[column.key]">
                {{ row[column.key] }}
              </span>
            </ng-container>
            <ng-container *ngIf="column.key === 'actions'">
              <button (click)="actionClick.emit({ action: 'delete', row: row })" class="text-red-600 hover:text-red-600/70 text-end">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                </svg>
              </button>
            </ng-container>
          </td>
        </ng-container>
      </tr>
    </tbody>
  </table>
</div>
