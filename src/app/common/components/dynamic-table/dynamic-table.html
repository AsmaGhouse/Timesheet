<table class="min-w-full divide-y divide-gray-200">
  <thead class="bg-gray-50">
    <tr>
      <th *ngFor="let column of columns" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
        {{ column.label }}
      </th>
    </tr>
  </thead>
  <tbody class="bg-white divide-y divide-gray-200">
    <tr *ngFor="let row of data">
      <ng-container *ngFor="let column of columns">
        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
          <ng-container *ngIf="column.key !== 'status' && column.key !== 'actions'">
            {{ row[column.key] }}
          </ng-container>
          <ng-container *ngIf="column.key === 'status'">
            <span [appStatusBadge]="row[column.key]">
              {{ row[column.key] }}
            </span>
          </ng-container>
          <ng-container *ngIf="column.key === 'actions'">
            <button class="text-indigo-600 hover:text-indigo-900">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
              </svg>
            </button>
          </ng-container>
        </td>
      </ng-container>
    </tr>
  </tbody>
</table>
